name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  # /download is built from each app's stable.json, so a daily rebuild picks up new app releases.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed."
            exit 0
          fi
          bunx wrangler@4 deploy
